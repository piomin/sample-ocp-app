---
apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  name: sample-ocp-app-tag
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[refs/tags/*]"
    pipelinesascode.tekton.dev/max-keep-runs: "5"
spec:
  params:
    - name: repo_url
      value: "{{ repo_url }}"
    - name: revision
      value: "{{ revision }}"
    - name: target_branch
      value: "{{ target_branch }}"
  pipelineSpec:
    params:
      - name: repo_url
      - name: revision
      - name: target_branch
    workspaces:
      - name: source
    tasks:
      - name: fetch-repository
        taskRef:
          resolver: cluster
          params:
            - name: kind
              value: task
            - name: name
              value: git-clone
            - name: namespace
              value: openshift-pipelines
        workspaces:
          - name: output
            workspace: source
        params:
          - name: URL
            value: $(params.repo_url)
          - name: REVISION
            value: $(params.revision)
          - name: SSL_VERIFY
            value: "false"
      - name: maven-build
        runAfter:
          - fetch-repository
        taskRef:
          resolver: cluster
          params:
            - name: kind
              value: task
            - name: name
              value: maven
            - name: namespace
              value: openshift-pipelines
        workspaces:
          - name: source
            workspace: source
        params:
          - name: JAVA_VERSION
            value: '25'
      - name: parse-tag
        runAfter:
          - maven-build
        params:
          - name: target_branch
            value: $(params.target_branch)
        taskSpec:
          params:
            - name: target_branch
          results:
            - name: tag-name
          steps:
            - name: parse
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              script: |
                #!/bin/sh
                echo -n "$(params.target_branch)" | sed 's#^refs/tags/##' | tee $(results.tag-name.path)
      - name: s2i-java
        runAfter:
          - parse-tag
        taskRef:
          resolver: cluster
          params:
            - name: kind
              value: task
            - name: name
              value: s2i-java
            - name: namespace
              value: openshift-pipelines
        workspaces:
          - name: source
            workspace: source
        params:
          - name: IMAGE
            value: image-registry.openshift-image-registry.svc:5000/ci/sample-ocp-app:$(tasks.parse-tag.results.tag-name)
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
